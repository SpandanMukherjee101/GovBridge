apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-government-service
  namespace: govbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-government-service
  template:
    metadata:
      labels:
        app: mock-government-service
    spec:
      containers:
      - name: mock-government-service
        image: mock-government-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3005
        envFrom:
        - configMapRef:
            name: govbridge-config
        - secretRef:
            name: govbridge-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: mock-government-service
  namespace: govbridge
spec:
  selector:
    app: mock-government-service
  ports:
  - port: 3005
    targetPort: 3005
