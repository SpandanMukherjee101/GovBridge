apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: govbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: notification-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3004
        envFrom:
        - configMapRef:
            name: govbridge-config
        - secretRef:
            name: govbridge-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: govbridge
spec:
  selector:
    app: notification-service
  ports:
  - port: 3004
    targetPort: 3004
